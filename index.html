<script type="module">
/* ═══ SKY DOGFIGHT · a Multiplayer Agent starter ═══════════════════════════════════════

 *   MATCH (HOST) .. kills, timer, winner, restart. Only the host writes these.
 *   BOTS (HOST) ... pick a target, lead it, fire, break off, stay clear of the sea. The host runs them.
 *   ME ............ flying, shooting, getting shot down. Each player writes only its own.
 *   HUD & RESULTS . kills, health, boost, gun sight, arrows to planes off screen, results, leaderboard
 *   INPUT ......... the plane flies toward the mouse; WASD too; on touch a steering stick, FIRE and BOOST
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player writes its OWN entity: `p` (one packed JSON field: position, heading,
 *     climb, bank, speed, alive, firing, smoking) about 12 times a second, `dth` {m, n, by}
 *     when it is shot down (match id, deaths so far, by whom), `rdy` (the match it pressed
 *     Play again on), `hb` (heartbeat) once a second, and `n`/`c` (name, color) once.
 *   - SHOTS ARE DECIDED BY THE SHOOTER. Your browser flies YOUR bullets against the planes
 *     as YOU see them and, on a hit, sends "hit" {to, dmg, by}. The victim lowers its own
 *     health; a hit on a bot goes to the host, which owns the bots. Everyone else just sees
 *     your guns firing (`f` in `p`) and draws tracers from your plane.
 *   - Other planes are drawn a little AHEAD of their last update (heading x speed x time
 *     since it arrived), then eased, so fast planes glide instead of stepping.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `match` (id, v, phase,
 *     endsAt, kills, kill feed, results) and `bots`. It credits a kill when it sees a
 *     player's `dth.n` go up (`match.cr` remembers which deaths are counted), so a new host
 *     adopts both from state and carries on: no reset.
 *   - A new match starts only when the host bumps match.id; every client then respawns.
 *   - ?attract plays offline with bots only and a chase camera (the preview video).
 *   - Leaderboard "dogfight-kills": your kills in one match, kept at your best.

// ── CONFIG ──────────────────────────────────────────────────────────────────────────

  dmg: 12,              // per bullet
  regenAfterMs: 5000,   // get away for this long and you patch up ...
  regen: 12,            // ... this much per second
  fireMs: 85,           // time between bullets while firing (the two guns take turns)
  bulletSpeed: 150,     // on top of the plane's own speed
  bulletLife: 0.75,     // seconds
  hitRadius: 2.6,       // a bullet hits if it passes this close to a plane (forgiving on purpose)
  assist: 0.09,         // a plane this close (radians) to your sight pulls your bullets onto it
  speed: 30, boostSpeed: 48, slowSpeed: 20, // units per second
  boostSecs: 3,         // a full boost tank; it refills when you let go
  turn: 1.25,           // fastest turn (radians/s)
  climb: 0.6,           // steepest climb or dive (radians)

  maxAlt: 140,
  worldRadius: 230,     // fly past this and the plane turns back on its own
  islands: 8,

// The sea: one big plane with a soft wave texture that drifts.
const waveTex = canvasTex(128, 128, (c) => {

// Islands: a sandy rim and a lumpy green dome; the first is a big one with a peak in the middle.
const ISLANDS = [{ x: 0, z: 0, r: 46, h: 30 }];
for (let tries = 0; ISLANDS.length < CONFIG.islands && tries < 500; tries++) {
  const a = seeded() * Math.PI * 2, d = 85 + seeded() * 120, r = 16 + seeded() * 20, x = Math.cos(a) * d, z = Math.sin(a) * d;

/** Height of the land under (x, z): 0 over the sea. */
function terrainAt(x, z) {

  for (const i of ISLANDS) { const d = Math.hypot(x - i.x, z - i.z) / i.r; if (d < 1) h = Math.max(h, i.h * Math.pow(1 - d * d, 0.8)); }

const sandMat = new THREE.MeshStandardMaterial({ color: "#f2dc9b", roughness: 1, flatShading: true }), grassMat = new THREE.MeshStandardMaterial({ color: "#5cc45a", roughness: 1, flatShading: true });

const palms = [];
for (const isl of ISLANDS) {
  const sand = new THREE.Mesh(new THREE.CylinderGeometry(isl.r * 1.02, isl.r * 1.12, 2.4, 28), sandMat); sand.position.set(isl.x, -0.6, isl.z); scene.add(sand);
  const dome = new THREE.SphereGeometry(isl.r * 0.9, 22, 10, 0, Math.PI * 2, 0, Math.PI / 2), pos = dome.attributes.position;

  }

  const grass = new THREE.Mesh(dome, grassMat); grass.position.set(isl.x, 0, isl.z); scene.add(grass);
  const foam = new THREE.Mesh(new THREE.RingGeometry(isl.r * 1.1, isl.r * 1.35, 32), foamMat); foam.rotation.x = -Math.PI / 2; foam.position.set(isl.x, 0.05, isl.z); scene.add(foam);

}
const mtx = new THREE.Matrix4(), col = new THREE.Color(), qv = new THREE.Quaternion(), pv = new THREE.Vector3(), sv = new THREE.Vector3(), ev = new THREE.Euler();
const trunks = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.35, 0.55, 7, 6).translate(0, 3.5, 0), new THREE.MeshStandardMaterial({ color: "#9a6a3a", flatShading: true }), palms.length);

// Clouds: clumps of white lumps at flying height (you fly straight through them).
const puffs = [];

  b.hp -= dmg; b.hitAt = now;
  if (b.target === null || Math.random() < 0.3) b.target = by; // turn on whoever is shooting
  if (b.hp <= 0) { b.alive = false; b.firing = false; b.respawnAt = now + CONFIG.respawnMs; writeMatch(addKill(m, by, id)); }
}

// ── ME ──────────────────────────────────────────────────────────────────────────────
let myName = "";
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
myName = myName || ["Flying", "Daring", "Lucky", "Zippy", "Jolly", "Swift"][Math.floor(Math.random() * 6)] + " " + ["Ace", "Pilot", "Falcon", "Gull", "Hawk"][Math.floor(Math.random() * 5)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
const me = { joined: false, x: 0, y: 60, z: -150, yaw: 0, pitch: 0, roll: 0, speed: CONFIG.speed, boost: CONFIG.boostSecs, hp: CONFIG.hp, alive: false, respawnAt: 0, shieldUntil: 0, hitAt: 0, deaths: 0, dth: null, ready: 0, killer: "", killerId: "", matchId: -1, lastShot: 0, lastSend: 0, lastJson: "", gun: 0, firing: false, submitted: -1, model: null };
const input = { left: 0, right: 0, up: 0, down: 0, fire: false, boost: false, mx: 0, my: 0, mouse: false, sx: 0, sy: 0 };

function spawnMe() {
  Object.assign(me, spawnSpot(), { pitch: 0, roll: 0, speed: CONFIG.speed, boost: CONFIG.boostSecs, hp: CONFIG.hp, alive: true, shieldUntil: performance.now() + CONFIG.shieldMs, hitAt: 0 });
  camPos.set(me.x - Math.sin(me.yaw) * 14, me.y + 5, me.z - Math.cos(me.yaw) * 14);
  publish(true);
}
/** Steering from all inputs: -1..1 for turn (left +) and climb (up +). The mouse/finger is
 *  measured from the middle of the screen, i.e. of the camera that draws the frame. */
function steering() {
  let turn = input.left - input.right, climb = input.up - input.down;
  if (input.sx || input.sy) { turn = -input.sx; climb = -input.sy; }
  else if (input.mouse && !turn && !climb) {
    const r = Math.min(innerWidth, innerHeight) * 0.35, dx = (input.mx - innerWidth / 2) / r, dy = (input.my - innerHeight / 2) / r, dead = (n) => (Math.abs(n) < 0.06 ? 0 : n);
    turn = -clamp(dead(dx), -1, 1); climb = -clamp(dead(dy), -1, 1);
  }
  return { turn, climb };
}
function myTick(dt, m, now) {
  if (me.matchId !== m.id) { // a new match (or we just arrived): respawn and close the results
    Object.assign(me, { matchId: m.id, deaths: 0, dth: null, ready: 0, killer: "", alive: false, respawnAt: 0 }); $("over").hidden = true;
  }
  if (!me.alive) { if (me.joined && now > me.respawnAt) spawnMe(); return; }
  const { turn, climb } = steering(), boosting = input.boost && me.boost > 0;
  me.boost = clamp(me.boost + (boosting ? -dt : dt * 0.5), 0, CONFIG.boostSecs);
  flyPlane(me, turn, climb, boosting ? CONFIG.boostSpeed : CONFIG.speed, dt);
  const aimed = touchUI && planes().some((p) => p.id !== net.sessionId && Math.hypot(p.x - me.x, p.y - me.y, p.z - me.z) < 100 && inSight(p) < 0.1); // phones fire on their own when someone is in the sight
  me.firing = (input.fire || aimed) && m.phase === "play";
  if (me.firing && now - me.lastShot > CONFIG.fireMs) { me.lastShot = now; shoot(me, net.sessionId, true, assistPoint()); }
  if (now - me.hitAt > CONFIG.regenAfterMs) me.hp = Math.min(CONFIG.hp, me.hp + CONFIG.regen * dt);
  if (me.hp < 40 && now > (me.smokeAt || 0)) { me.smokeAt = now + 70; smoke(me); }
  publish(false);
}
/** Where to pull my bullets: the lead point of a plane very near my sight, or null (straight ahead). */
function assistPoint() {
  let best = null, bd = CONFIG.assist;
  for (const p of planes()) {
    if (p.id === net.sessionId) continue;
    const dist = Math.hypot(p.x - me.x, p.y - me.y, p.z - me.z); if (dist > 130) continue;
    const t = dist / (CONFIG.bulletSpeed + me.speed), d = dirOf(p.yaw, p.pitch), lead = { x: p.x + d.x * p.speed * t, y: p.y + d.y * p.speed * t, z: p.z + d.z * p.speed * t }, off = inSight(lead);
    if (off < bd) { bd = off; best = lead; }
  }
  return best;
}
/** How far (radians) a point is from straight ahead of my guns. */
function inSight(p) { const d = dirOf(me.yaw, me.pitch), dx = p.x - me.x, dy = p.y - me.y, dz = p.z - me.z, l = Math.hypot(dx, dy, dz) || 1; return Math.acos(clamp((d.x * dx + d.y * dy + d.z * dz) / l, -1, 1)); }
function publish(force) {
  const now = performance.now();
  if (!force && now - me.lastSend < 80) return; // ~12/s, and only when something changed
  const r = (n) => Math.round(n * 10) / 10, r2 = (n) => Math.round(n * 100) / 100;
  const json = JSON.stringify({ x: r(me.x), y: r(me.y), z: r(me.z), h: r2(me.yaw), t: r2(me.pitch), r: r2(me.roll), s: r(me.speed), a: me.alive ? 1 : 0, f: me.firing ? 1 : 0, l: me.hp < 40 ? 1 : 0 });
  if (json === me.lastJson) return;
  me.lastSend = now; me.lastJson = json; net.me.set("p", json);
}
function hitMarker() { hitAt = performance.now(); sfx("hit"); }
/** Route a hit to whoever owns the victim's health: me, the host (bots), or the victim's browser. */
function damage(to, dmg, by) {
  if (to === net.sessionId) hurtMe(dmg, by);
  else if (isHost() && host.bots.has(to)) hurtBot(to, dmg, by);
  else net.send("hit", { to, dmg, by });
}
function hurtMe(dmg, by) {
  const m = match(), now = performance.now();
  if (!me.alive || !m || m.phase !== "play" || now < me.shieldUntil) return;
  me.hp -= dmg; me.hitAt = now; sfx("hurt");
  $("hurt").style.transition = "none"; $("hurt").style.opacity = 0.7; requestAnimationFrame(() => { $("hurt").style.transition = "opacity .4s"; $("hurt").style.opacity = 0; });
  if (me.hp > 0) return publish(true);
  me.alive = false; me.firing = false; me.deaths++; me.killer = nameOf(by); me.killerId = by; me.respawnAt = now + CONFIG.respawnMs;
  me.dth = { m: m.id, n: me.deaths, by };
  net.me.set("dth", JSON.stringify(me.dth));
  explode(me.x, me.y, me.z, myColor);
  publish(true);
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
const ctx2d = $("overlay").getContext("2d");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}`;
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
let board = null, boardFor = -1, joinedAt = 0, lastFeed = "", hitAt = 0, lastKills = 0;
function hud(m, now) {
  const feed = m.feed.map(([a, ac, b, bc]) => `<div><span style="color:${esc(ac)}">${esc(a)}</span> ✈ <span style="color:${esc(bc)}">${esc(b)}</span></div>`).join("");
  if (feed !== lastFeed) $("feed").innerHTML = lastFeed = feed;
  if (ATTRACT) { for (const id of ["score", "hp", "msg", "help", "net", "feed"]) $(id).style.display = "none"; return; }
  const rank = ranking(m), mine = m.k[net.sessionId] || 0, place = rank.findIndex((r) => r.id === net.sessionId) + 1;
  if (mine > lastKills) sfx("kill"); lastKills = mine;
  $("score").innerHTML = `<b>${mine}</b>kills · ${place ? `${ord(place)} of ${rank.length}` : ""} · ${clock(Math.max(0, m.endsAt - Date.now()))}<br><span style="opacity:.8">first to ${CONFIG.killLimit}${rank[0] && rank[0].k ? ` · leader ${esc(rank[0].n)} ${rank[0].k}` : ""}</span>`;
  $("hp").innerHTML = me.alive ? `♥ ${Math.max(0, Math.round(me.hp))}<i><b style="width:${Math.max(0, me.hp)}%;background:${me.hp < 40 ? "#ff4d6d" : "#4ee08a"}"></b></i><i class="boost"><b style="width:${(me.boost / CONFIG.boostSecs) * 100}%"></b></i>` : "";
  const edge = Math.hypot(me.x, me.z) > CONFIG.worldRadius - 10;
  $("msg").textContent = !me.joined || m.phase !== "play" ? "" : !me.alive && me.killer ? `Shot down by ${me.killer} · back in ${Math.max(1, Math.ceil((me.respawnAt - now) / 1000))}` : edge ? "Turning back to the islands" : "";
  $("help").style.opacity = me.joined && now - joinedAt < 9000 ? 1 : 0;
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the bots" : ""}`;
  $("start").hidden = m.phase !== "play" || me.joined;
  $("over").hidden = m.phase !== "over";
  if (m.phase === "over") {
    $("winner").textContent = !m.win ? "Draw!" : m.res[0] && m.res[0][0] === net.sessionId ? "You win!" : `${m.win} wins!`;
    $("results").innerHTML = m.res.map(([id, name, c, k]) => `<li class="${id === net.sessionId ? "me" : ""}"><i style="background:${esc(c)}"></i>${esc(name)}<span>${k}</span></li>`).join("");
    const people = humans(), ready = people.filter((id) => (id === net.sessionId ? me.ready : (S.entities.players[id] || {}).rdy) === m.id).length;
    $("again").textContent = me.ready === m.id ? `Ready (${ready}/${people.length})` : "Play again";
    $("next").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - Date.now()) / 1000))}s`;
    if (boardFor !== m.id) { boardFor = m.id; showBoard(m); }
  }
}
/** The 2D layer over the 3D view: gun sight, the mouse ring, arrows to planes off screen. */
const proj = new THREE.Vector3();
function drawOverlay(now) {
  ctx2d.clearRect(0, 0, innerWidth, innerHeight);
  if (ATTRACT || !me.alive) return;
  const w = innerWidth, h = innerHeight, d = dirOf(me.yaw, me.pitch);
  proj.set(me.x + d.x * 80, me.y + d.y * 80, me.z + d.z * 80).project(camera); // where the guns point
  const gx = (proj.x + 1) / 2 * w, gy = (1 - proj.y) / 2 * h, hit = now - hitAt < 150;
  ctx2d.lineWidth = 2.5; ctx2d.strokeStyle = hit ? "#ff4d6d" : "#ffffffdd"; ctx2d.beginPath(); ctx2d.arc(gx, gy, hit ? 16 : 13, 0, Math.PI * 2); ctx2d.stroke();
  ctx2d.fillStyle = ctx2d.strokeStyle; ctx2d.fillRect(gx - 2, gy - 2, 4, 4);
  if (input.mouse && !touchUI) { ctx2d.strokeStyle = "#ffffff77"; ctx2d.lineWidth = 2; ctx2d.beginPath(); ctx2d.arc(input.mx, input.my, 7, 0, Math.PI * 2); ctx2d.stroke(); }
  for (const [id, v] of views) { // planes off screen: an arrow at the edge in their color
    if (!v.alive) continue;
    proj.set(v.x, v.y, v.z).project(camera);
    const behind = proj.z > 1, on = !behind && Math.abs(proj.x) < 0.95 && Math.abs(proj.y) < 0.92;
    if (on) continue;
    let ax = behind ? -proj.x : proj.x, ay = behind ? -proj.y : proj.y; const k = 1 / Math.max(Math.abs(ax) / 0.9, Math.abs(ay) / 0.86, 1e-3); ax *= k; ay *= k;
    const x = (ax + 1) / 2 * w, y = (1 - ay) / 2 * h, a = Math.atan2(-ay, ax);
    ctx2d.save(); ctx2d.translate(x, y); ctx2d.rotate(a); ctx2d.fillStyle = v.color; ctx2d.strokeStyle = "#0008"; ctx2d.lineWidth = 2;
    ctx2d.beginPath(); ctx2d.moveTo(12, 0); ctx2d.lineTo(-7, -8); ctx2d.lineTo(-7, 8); ctx2d.closePath(); ctx2d.stroke(); ctx2d.fill(); ctx2d.restore();
  }
}
function showBoard(m) {
  const list = $("board"), mine = m.k[net.sessionId] || 0;
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  (mine > 0 && me.submitted !== m.id ? board.submit(mine).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li>No kills yet. Score the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
  me.submitted = m.id;
}
$("again").onclick = () => { const m = match(); if (m && m.phase === "over") { me.ready = m.id; net.me.set("rdy", m.id); } };

/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId)) return;
  const taken = new Set(others.map(([, p]) => p.c));
  myColor = COLORS.find((c) => !taken.has(c)) || myColor; net.me.set("c", myColor);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT, cv = renderer.domElement;
$("touch").hidden = !touchUI; $("limit").textContent = CONFIG.killLimit;
$("help").textContent = touchUI ? "Drag to steer · your guns fire when someone is in the sight" : "Point the mouse where you want to fly · hold the button to fire · Shift boosts";
if (touchUI) { $("how").textContent = "Drag on the left to steer · guns fire by themselves when a plane is in the sight · FIRE and BOOST buttons too"; $("play").textContent = "Tap to fly"; }
const KEYS = { KeyA: "left", ArrowLeft: "left", KeyD: "right", ArrowRight: "right", KeyW: "up", ArrowUp: "up", KeyS: "down", ArrowDown: "down", Space: "fire", ShiftLeft: "boost", ShiftRight: "boost" };
addEventListener("keydown", (e) => { const k = KEYS[e.code]; if (k) { e.preventDefault(); input[k] = k === "fire" || k === "boost" ? true : 1; } });
addEventListener("keyup", (e) => { const k = KEYS[e.code]; if (k) input[k] = k === "fire" || k === "boost" ? false : 0; });
addEventListener("blur", () => Object.assign(input, { left: 0, right: 0, up: 0, down: 0, fire: false, boost: false }));
$("play").onclick = () => { if (!me.joined) { me.joined = true; joinedAt = performance.now(); } unlockAudio(); };
addEventListener("mousemove", (e) => { input.mx = e.clientX; input.my = e.clientY; input.mouse = true; });
document.addEventListener("mouseleave", () => { input.mx = innerWidth / 2; input.my = innerHeight / 2; });
cv.addEventListener("mousedown", (e) => { if (e.button === 0) input.fire = true; });
addEventListener("mouseup", () => { input.fire = false; });
// Touch: a floating stick anywhere on the left 60% of the screen steers; FIRE and BOOST on the right.
const touch = { stick: null, ox: 0, oy: 0 };
cv.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "touch" || touch.stick !== null || e.clientX > innerWidth * 0.6) return;
  e.preventDefault(); unlockAudio();
  Object.assign(touch, { stick: e.pointerId, ox: e.clientX, oy: e.clientY }); Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
addEventListener("pointermove", (e) => {
  if (e.pointerId !== touch.stick) return;
  const dx = e.clientX - touch.ox, dy = e.clientY - touch.oy, d = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
  input.sx = (Math.cos(a) * d) / 50; input.sy = (Math.sin(a) * d) / 50;
  $("stick").firstChild.style.transform = `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerId === touch.stick) { touch.stick = null; input.sx = input.sy = 0; $("stick").hidden = true; $("stick").firstChild.style.transform = ""; }
});
for (const [id, key] of [["fire", "fire"], ["boost", "boost"]]) {
  const b = $(id);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); unlockAudio(); input[key] = true; b.classList.add("on"); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => { input[key] = false; b.classList.remove("on"); });
}
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const camPos = new THREE.Vector3(0, 70, -200), camLook = new THREE.Vector3();
const chase = { focus: null, focusAt: 0 };
function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(); // not `now`: the first frame after a freeze can be stamped from before it ended
  if (frameAt && t0 - frameAt > 1000) { wokeAt = t0; host.wasHost = false; host.last = null; } // woke from a stall: drop my host copy, adopt state again (see isHost)
  frameAt = t0;
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const m = match();
  if (m) myTick(dt, m, now);
  syncViews(dt, now);
  tickBullets(dt, planes());
  tickParts(dt);
  waveTex.offset.x = now / 90000; waveTex.offset.y = now / 140000;
  if (!me.model || me.model.color !== myColor) { if (me.model) scene.remove(me.model.g); me.model = makePlane(myColor, ""); }
  me.model.g.visible = me.alive; if (me.alive) poseModel(me.model, me, dt);
  if (engine) { engine.o.frequency.value = 50 + me.speed * 1.6; engine.g.gain.value = me.alive ? 0.035 : 0; }
  let fov = baseFov;
  if (me.alive && !ATTRACT) { chaseCam(me, dt, 13, 4.5, 0, 0.25); fov = baseFov + (me.speed - CONFIG.speed) * 0.5; }
  else watchCam(dt, now);
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }
  placeClouds();
  for (const v of views.values()) if (v.alive && v.id !== chase.focus) v.m.g.visible = camera.position.distanceTo(v.m.g.position) > 7; // a plane right on the camera would fill the screen
  renderer.render(scene, camera);
  drawOverlay(now);
  if (m && now - lastHud > 100) { lastHud = now; hud(m, now); }
}
/** Behind and above a plane, lagging a little so turns show; banks a touch with it. */
function chaseCam(p, dt, back, up, side, tilt) {
  const d = dirOf(p.yaw, p.pitch * 0.6), rx = -Math.cos(p.yaw), rz = Math.sin(p.yaw);
  camPos.lerp(pv.set(p.x - d.x * back + rx * side, p.y - d.y * back + up, p.z - d.z * back + rz * side), 1 - Math.exp(-dt * 5));
  const f = dirOf(p.yaw, p.pitch);
  camLook.set(p.x + f.x * 20, p.y + f.y * 20 + 2, p.z + f.z * 20);
  camera.position.copy(camPos); camera.lookAt(camLook); camera.rotateZ(-p.roll * tilt);
}
/** ?attract, the start card and while you wait to respawn: chase whoever is busy dogfighting. */
function watchCam(dt, now) {
  const alive = [...views.values()].filter((v) => v.alive);
  if (!me.joined || ATTRACT || !views.get(me.killerId)?.alive) {
    if (now > chase.focusAt || !views.get(chase.focus)?.alive) {
      const busy = alive.filter((v) => v.f || now - v.firedAt < 600);
      chase.focus = (busy[Math.floor(Math.random() * busy.length)] || alive[Math.floor(Math.random() * alive.length)] || {}).id;
      chase.focusAt = now + 4500;
    }
  } else chase.focus = me.killerId; // shot down: watch who did it
  const v = views.get(chase.focus);
  if (v) chaseCam(v, dt, ATTRACT ? 12 : 15, ATTRACT ? 4.5 : 5.5, 3, 0.12);
  else { camera.position.copy(camPos); camera.lookAt(0, 20, 0); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (msg, from) => {
    if (!msg) return;
    const dmg = Math.min(CONFIG.dmg, Math.max(0, +msg.dmg || 0)), by = msg.by || from;
    if (msg.to === net.sessionId) hurtMe(dmg, by); else if (isHost() && host.bots.has(msg.to)) hurtBot(msg.to, dmg, by);
  });
  net.onDisconnect(() => { $("net").textContent = "Reconnecting…"; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { $("net").textContent = ""; Object.assign(CONFIG, { seats: 8, killLimit: 999, matchMs: 9e6, respawnMs: 1200, botAim: 0.03, dmg: 20, worldRadius: 130 }); }
  requestAnimationFrame(frame);
})();
</script>
